<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>intent-prompt-graph</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <span id="status-dot" class="dot"></span>
      <span id="session-title">intent-prompt-graph</span>
      <span id="mode-pill" class="pill">heuristic</span>
    </div>
    <div class="legend">
      <span><i class="swatch" style="background:var(--goal)"></i>Goal</span>
      <span><i class="swatch" style="background:var(--chosen)"></i>Chosen</span>
      <span><i class="swatch" style="background:var(--rejected)"></i>Rejected</span>
      <span><i class="swatch" style="background:var(--option)"></i>Not chosen</span>
      <span><i class="swatch" style="background:var(--decision)"></i>Decision</span>
      <span><i class="swatch" style="background:var(--loop)"></i>Loop</span>
      <span><i class="swatch" style="background:var(--side)"></i>Side Q</span>
    </div>
  </header>

  <aside id="sidebar"></aside>

  <main id="viewport">
    <div id="banner" hidden></div>
    <div id="world">
      <svg id="edges"></svg>
      <div id="nodes"></div>
    </div>
    <div id="toast" hidden></div>
    <nav id="bar">
      <button type="button" data-filter="all" class="active">All paths</button>
      <button type="button" data-filter="chosen">Chosen path only</button>
      <button type="button" data-filter="decisions">Decisions &amp; Rejections</button>
      <span class="sep"></span>
      <button id="follow" type="button" aria-pressed="true">Follow: on</button>
      <button id="fit" type="button">Fit</button>
      <button id="reset" type="button">100%</button>
    </nav>
  </main>

  <aside id="panel"></aside>
</div>
<script type="module" src="./app.ts"></script>
</body>
</html>
