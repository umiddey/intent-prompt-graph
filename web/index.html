<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>intent-prompt-graph</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <h1>Intents</h1>
    <ul id="intents"></ul>
  </aside>
  <main id="viewport">
    <div id="banner" hidden></div>
    <div id="world">
      <svg id="edges"></svg>
      <div id="nodes"></div>
    </div>
    <div id="toast" hidden></div>
    <nav id="bar">
      <button id="follow" type="button" aria-pressed="true">Follow latest: on</button>
      <button id="fit" type="button">Fit</button>
      <button id="reset" type="button">Reset zoom</button>
    </nav>
  </main>
  <aside id="panel"></aside>
</div>
<script type="module" src="./app.ts"></script>
</body>
</html>
