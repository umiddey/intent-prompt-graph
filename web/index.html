<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>intent-prompt-graph</title>
<script>
// Sets the theme before first paint: the stored choice, else the system colour scheme.
(function () {
  var theme = null;
  try { theme = localStorage.getItem("ipg.theme"); } catch (e) {}
  if (theme !== "ink" && theme !== "paper") theme = matchMedia("(prefers-color-scheme: light)").matches ? "paper" : "ink";
  document.documentElement.dataset.theme = theme;
})();
</script>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <span id="status-dot" class="dot"></span>
      <span id="session-title">intent-prompt-graph</span>
      <span id="mode-pill" class="pill">heuristic</span>
    </div>
    <div class="top-right">
      <div class="legend">
        <span class="grp-chosen"><i class="swatch"></i>Goal / chosen</span>
        <span class="grp-rejected"><i class="swatch"></i>Rejected / not chosen</span>
        <span class="grp-other"><i class="swatch"></i>Decision / loop / side</span>
      </div>
      <button id="theme" type="button" title="Switch colour theme"></button>
    </div>
  </header>

  <aside id="sidebar"></aside>

  <main id="viewport" data-view="timeline">
    <section id="timeline">
      <div id="tl-summary"></div>
      <div id="tl-rows"></div>
    </section>
    <div id="stage">
      <div id="world">
        <div id="bands"></div>
        <svg id="edges"></svg>
        <div id="nodes"></div>
        <div id="labels"></div>
      </div>
    </div>
    <div id="minimap" class="graph-only" hidden>
      <div id="mini-frame">
        <div id="mini-bands"></div>
        <div id="mini-view"></div>
      </div>
    </div>
    <div id="banner" hidden></div>
    <div id="toast" hidden></div>
    <nav id="bar">
      <button type="button" data-set-view="timeline" class="active">Timeline</button>
      <button type="button" data-set-view="graph">Graph</button>
      <span class="sep"></span>
      <button type="button" data-filter="all" class="active">All paths</button>
      <button type="button" data-filter="chosen">Chosen path only</button>
      <button type="button" data-filter="decisions">Decisions &amp; Rejections</button>
      <span class="sep"></span>
      <button id="follow" type="button" aria-pressed="true">Follow: on</button>
      <button id="fit" type="button" class="graph-only">Fit</button>
      <button id="reset" type="button" class="graph-only">100%</button>
    </nav>
  </main>

  <aside id="panel"></aside>
</div>
<script type="module" src="./app.ts"></script>
</body>
</html>
