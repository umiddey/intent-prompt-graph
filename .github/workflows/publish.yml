# Publishes intent-prompt-graph to npm on every push to main whose package.json
# version is not on npm yet, via npm trusted publishing (OIDC). No NPM_TOKEN
# secret exists or is used. To release: bump "version" in package.json and push.
#
# One-time bootstrap: npm only lets a package get a trusted publisher once the
# package exists. Publish 0.1.0 once by hand (owner `npm login`, then
# `npm publish --access public` from the verified tarball). Then register this
# workflow on npmjs.com: package intent-prompt-graph -> Settings -> Trusted
# Publisher -> umiddey/intent-prompt-graph, workflow publish.yml.
name: publish
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'
      # Trusted publishing (OIDC-authenticated PUT) requires npm >= 11.5.
      - run: npm install -g npm@11.6.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: decide whether this version needs publishing
        id: need
        run: |
          name="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          if ! npm view "$name" name >/dev/null 2>&1; then
            echo "::notice::$name is not on npm yet; do the one-time manual publish first"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif npm view "$name@$ver" version 2>/dev/null | grep -qx "$ver"; then
            echo "::notice::$name@$ver is already on npm; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.need.outputs.publish == 'true'
        run: npm publish --access public
